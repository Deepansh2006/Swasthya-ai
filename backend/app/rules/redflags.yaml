# redflags.yaml
# Exhaustive Deterministic Emergency Protocols derived from WHO IMCI & National Health Mission (NHM)

protocols:
  - id: "EMERG_PEDIATRIC_DANGER"
    name: "WHO IMCI Pediatric General Danger Signs"
    target_group: ["neonate", "infant", "child"]
    urgency: "EMERGENCY"
    action_hi: "बच्चे को तुरंत 108 एम्बुलेंस बुलाकर अस्पताल ले जाएं। यह एक गंभीर आपात स्थिति है।"
    source: "WHO IMCI Chart Booklet 2014, Page 12"
    triggers:
      - "दूध नहीं"
      - "स्तनपान नहीं"
      - "उल्टी"
      - "सब कुछ उल्टी"
      - "दौरे"
      - "दौरा"
      - "झटके"
      - "झटका"
      - "सुस्त और बेहोश"
      - "बेहोश"
      - "hosh nahi"
      - "doodh nahi"
      - "daura"
      - "jhatke"
      - "vomit everything"
      - "convulsion"
      - "unconscious"
      - "आंखें ऊपर"
      - "नीला पड़"
      - "त्वचा 2 सेकंड"

  - id: "EMERG_MENINGITIS"
    name: "Severe Febrile Disease / Meningitis"
    target_group: ["infant", "child", "all"]
    urgency: "EMERGENCY"
    action_hi: "तेज बुखार के साथ गर्दन अकड़ना मस्तिष्क ज्वर (Meningitis) का गंभीर लक्षण हो सकता है। तुरंत 108 बुलाकर अस्पताल ले जाएं।"
    source: "WHO IMCI Febrile Disease Protocol"
    triggers:
      - "गर्दन अकड़"
      - "गर्दन में अकड़न"
      - "stiff neck"
      - "meningitis"

  - id: "EMERG_NEONATAL"
    name: "NHM HBNC Neonatal Danger Signs"
    target_group: ["neonate"]
    urgency: "EMERGENCY"
    action_hi: "नवजात शिशु के लिए यह अत्यंत गंभीर खतरा है। तुरंत 108 बुलाकर नजदीकी SNCU अस्पताल ले जाएं।"
    source: "NHM ASHA Training Module 7 (HBNC)"
    triggers:
      - "ठंडा पड़"
      - "शरीर ठंडा"
      - "नाभि से"
      - "पीले पड़"
      - "पीले हैं"
      - "hypothermia"
      - "umbilical"
      - "jaundice"

  - id: "EMERG_PEDIATRIC_RESPIRATORY"
    name: "Severe Pneumonia / Chest Indrawing"
    target_group: ["infant", "child"]
    urgency: "EMERGENCY"
    action_hi: "बच्चे की पसली चल रही है और सांस लेने में भारी तकलीफ है। तुरंत 108 पर कॉल करें।"
    source: "WHO IMCI Chart Booklet 2014, Page 15"
    triggers:
      - "पसली चल"
      - "पसली धंस"
      - "छाती धंस"
      - "पसली अंदर"
      - "सांस फूल"
      - "सांस नहीं ले पा"
      - "सांस लेने में भारी"
      - "सांस लेने में तकलीफ"
      - "घरघराहट"
      - "दम घुट"
      - "pasli chal"
      - "chhati dhans"
      - "chest indrawing"
      - "stridor"
      - "gasping"
      - "saas phool"

  - id: "EMERG_ADULT_CARDIOVASCULAR"
    name: "Acute Coronary Syndrome / Heart Attack"
    target_group: ["adult", "elderly"]
    urgency: "EMERGENCY"
    action_hi: "तुरंत 108 एम्बुलेंस को कॉल करें। मरीज को शांत बैठाएं, चलने न दें और नजदीकी अस्पताल ले जाएं।"
    source: "NHM Emergency Protocol - Acute Chest Pain"
    triggers:
      - "छाती में तेज दर्द"
      - "सीने में तेज दर्द"
      - "सीने में बहुत तेज"
      - "सीने में भारीपन"
      - "छाती में भारीपन"
      - "बाईं बांह में दर्द"
      - "छाती में दर्द"
      - "सीने में दर्द"
      - "छाती में दबाव"
      - "पत्थर रख दिया"
      - "छाती में असहनीय"
      - "chest pain"
      - "heart attack"
      - "chhati me dard"
      - "seene me dard"
      - "left arm pain"

  - id: "EMERG_ADULT_STROKE"
    name: "Acute Stroke (FAST Protocol)"
    target_group: ["adult", "elderly"]
    urgency: "EMERGENCY"
    action_hi: "अचानक लकवा/स्ट्रोक के लक्षण हैं। तुरंत 108 को कॉल करें। पहले 4 घंटे में अस्पताल पहुंचना अति आवश्यक है।"
    source: "ICMR Stroke Management Guidelines"
    triggers:
      - "मुंह टेढ़ा"
      - "आवाज लड़खड़ा"
      - "जुबान लड़खड़ा"
      - "हाथ पैर सुन्न"
      - "कमजोर हो गया"
      - "लकवा"
      - "जमीन पर गिर"
      - "stroke"
      - "muh tedha"
      - "slurred speech"
      - "paralysis"
      - "one side weakness"

  - id: "EMERG_MATERNAL"
    name: "Maternal Obstetric Emergency"
    target_group: ["pregnant_woman", "adult"]
    urgency: "EMERGENCY"
    action_hi: "गर्भावस्था में यह अत्यंत गंभीर खतरा है। बिना देर किए तुरंत 108 एम्बुलेंस से अस्पताल पहुंचें।"
    source: "NHM ASHA Training Module 6"
    triggers:
      - "गर्भावस्था में खून"
      - "गर्भवती को खून"
      - "गर्भ में खून"
      - "खून बहने लगा"
      - "धुंधला दिख"
      - "चेहरे पर सूजन"
      - "पानी की थैली"
      - "होश खो बैठी"
      - "bleeding in pregnancy"
      - "eclampsia"
      - "pregnant bleeding"
      - "garbh me khoon"

  - id: "EMERG_TRAUMA_POISON"
    name: "Snakebite, Severe Trauma and Poisoning"
    target_group: ["all"]
    urgency: "EMERGENCY"
    action_hi: "अत्यंत गंभीर आपात स्थिति। अंग को स्थिर रखें और तुरंत 108 बुलाकर अस्पताल जाएं।"
    source: "NHM Primary Emergency Care"
    triggers:
